document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

hepr<span style=\"font-weight:800;\">IA<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:9px; padding:7px 14px 7px 11px; border:1px solid rgba(21,23,28,0.10); border-radius:999px; background:rgba(255,255,255,0.6); backdrop-filter:blur(6px); font-size:13px; font-weight:500; color:#3A3D45;\">\n      <span style=\"display:inline-block; width:7px; height:7px; border-radius:50%; background:#1FA463; animation:khPulse 2.4s ease-in-out infinite;\"><\u002Fspan>\n      Bientôt en ligne\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:0 clamp(20px,5vw,56px) 40px;\">\n\n    <div style=\"position:relative; width:clamp(220px,40vw,350px); aspect-ratio:1; display:flex; align-items:center; justify-content:center; margin-bottom:2px;\">\n      <sc-if value=\"{{ halo }}\" hint-placeholder-val=\"{{ true }}\">\n        <div aria-hidden=\"true\" style=\"position:absolute; width:80%; height:80%; border-radius:50%; filter:blur(46px); opacity:0.6; background:radial-gradient(circle at 50% 42%, rgba(150,170,235,0.55), rgba(210,185,150,0.28) 55%, transparent 72%);\"><\u002Fdiv>\n      <\u002Fsc-if>\n      <canvas ref=\"{{ canvasRef }}\" style=\"position:relative; width:100%; height:100%; display:block; animation:khFadeIn 1.4s ease both;\"><\u002Fcanvas>\n      <div aria-hidden=\"true\" style=\"position:absolute; bottom:6%; width:46%; height:7%; border-radius:50%; background:rgba(21,23,28,0.14); filter:blur(16px);\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border:1px solid rgba(21,23,28,0.10); border-radius:999px; font-size:12.5px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:#6A6E78; animation:khFadeUp .8s ease both .15s;\">\n      Nouvelle vitrine en préparation\n    <\u002Fdiv>\n\n    < heme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Nacré&quot;, &quot;Or scarabée&quot;, &quot;Bleu nuit&quot;, &quot;Encre&quot;], &quot;default&quot;: &quot;Nacré&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;speed&quot;: { &quot;editor&quot;: &quot;float&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0.2, &quot;max&quot;: 2, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot; },\n  &quot;halo&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }\n}\">\nclass Component extends DCLogic {\n  canvasRef = React.createRef();\n\n  themes = {\n    \"Nacré\":       { base:[0.93,0.94,0.97],  phase:[0.62,0.70,0.86], mix:0.34, rim:0.50, amp:0.13 },\n    \"Or scarabée\": { base:[0.95,0.89,0.74],  phase:[0.06,0.22,0.48], mix:0.55, rim:0.58, amp:0.13 },\n    \"Bleu nuit\":   { base:[0.78,0.85,0.98],  phase:[0.55,0.62,0.85], mix:0.55, rim:0.60, amp:0.14 },\n    \"Encre\":       { base:[0.09,0.10,0.13],  phase:[0.00,0.15,0.40], mix:0.78, rim:0.95, amp:0.12 }\n  };\n\n  renderVals() {\n    return { canvasRef: this.canvasRef, halo: this.props.halo ?? true };\n  }\n\n  componentDidMount() {\n    this._t = 0; this._mx = 0; this._my = 0; this._rx = 0; this._ry = 0;\n    this._onPointer = (e) => {\n      this._mx = (e.clientX / window.innerWidth) * 2 - 1;\n      this._my = -((e.clientY / window.innerHeight) * 2 - 1);\n    };\n    window.addEventListener('pointermove', this._onPointer);\n    this._wait();\n  }\n\n  _wait() {\n    if (!this._isAlive) this._isAlive = true;\n    if (window.THREE && this.canvasRef.current) { this._init(); }\n    else { this._waitT = setTimeout(() => this._wait(), 60); }\n  }\n\n  _theme() { return this.themes[this.props.theme] || this.themes[\"Nacré\"]; }\n\n  _init() {\n    const THREE = window.THREE;\n    const canvas = this.canvasRef.current;\n    const container = canvas.parentElement;\n\n    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });\n    renderer.setClearColor(0x000000, 0);\n    const scene = new THREE.Scene();\n    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);\n    camera.position.z = 4.3;\n\n    const t = this._theme();\n    const uniforms = {\n      uTime: { value: 0 },\n      uBase: { value: new THREE.Vector3(...t.base) },\n      uPhase:{ value: new THREE.Vector3(...t.phase) },\n      uMix:  { value: t.mix },\n      uRim:  { value: t.rim },\n      uAmp:  { value: t.amp }\n    };\n    this._uniforms = uniforms;\n\n    const noiseGLSL = `\n      vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}\n      vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}\n      vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}\n      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}\n      float snoise(vec3 v){\n        const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);\n        vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);\n        vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);\n        vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;\n        i=mod289(i);\n        vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));\n        float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;\n        vec4 j=p-49.0*floor(p*ns.z*ns.z);\n        vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);\n        vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);\n        vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);\n        vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));\n        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;\n        vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);\n        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));\n        p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;\n        vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;\n        return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));\n      }`;\n\n    const material = new THREE.ShaderMaterial({\n      uniforms,\n      vertexShader: noiseGLSL + `\n        uniform float uTime; uniform float uAmp;\n        varying vec3 vNormal; varying vec3 vView; varying float vN;\n        void main(){\n          vec3 p = position;\n          float n  = snoise(normalize(position)*1.4 + uTime*0.18);\n          float n2 = snoise(normalize(position)*3.1 - uTime*0.13)*0.45;\n          float disp = (n + n2) * uAmp;\n          vN = disp;\n          p += normal * disp;\n          vec4 mv = modelViewMatrix * vec4(p,1.0);\n          vView = normalize(-mv.xyz);\n          vNormal = normalize(normalMatrix * normal);\n          gl_Position = projectionMatrix * mv;\n        }`,\n      fragmentShader: `\n        uniform vec3 uBase; uniform vec3 uPhase; uniform float uMix; uniform float uRim; uniform float uTime;\n        varying vec3 vNormal; varying vec3 vView; varying float vN;\n        vec3 pal(float t, vec3 ph){ return vec3(0.5)+vec3(0.5)*cos(6.28318*(t+ph)); }\n        void main(){\n          vec3 N = normalize(vNormal); vec3 V = normalize(vView);\n          float fres = pow(1.0 - max(dot(N,V),0.0), 2.2);\n          float t = fres*0.8 + vN*1.6 + uTime*0.03;\n          vec3 ir = pal(t, uPhase);\n          vec3 col = mix(uBase, ir, uMix);\n          col += fres * uRim;\n          col = clamp(col, 0.0, 1.0);\n          gl_FragColor = vec4(col, 1.0);\n        }`\n    });\n\n    const geo = new THREE.IcosahedronGeometry(1.25, 6);\n    const mesh = new THREE.Mesh(geo, material);\n    const group = new THREE.Group();\n    group.add(mesh);\n    group.rotation.x = 0.25;\n    scene.add(group);\n\n    this._refs = { renderer, scene, camera, group, material, geo, container };\n\n    const resize = () => {\n      const r = container.getBoundingClientRect();\n      const s = Math.max(1, Math.min(r.width, r.height));\n      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));\n      renderer.setSize(s, s, false);\n      camera.aspect = 1; camera.updateProjectionMatrix();\n    };\n    resize();\n    this._ro = new ResizeObserver(resize);\n    this._ro.observe(container);\n\n    const animate = () => {\n      this._raf = requestAnimationFrame(animate);\n      const sp = this.props.speed ?? 1;\n      this._t += 0.016 * sp;\n      uniforms.uTime.value = this._t;\n      this._rx += (this._my * 0.28 - this._rx) * 0.05;\n      this._ry += (this._mx * 0.4 - this._ry) * 0.05;\n      group.rotation.x = 0.22 + this._rx + Math.sin(this._t * 0.15) * 0.05;\n      group.rotation.y = this._ry + this._t * 0.12;\n      const breathe = 1 + Math.sin(this._t * 0.5) * 0.015;\n      group.scale.setScalar(breathe);\n      renderer.render(scene, camera);\n    };\n    animate();\n  }\n\n  componentDidUpdate() {\n    if (!this._uniforms || !window.THREE) return;\n    const t = this._theme();\n    this._uniforms.uBase.value.set(...t.base);\n    this._uniforms.uPhase.value.set(...t.phase);\n    this._uniforms.uMix.value = t.mix;\n    this._uniforms.uRim.value = t.rim;\n    this._uniforms.uAmp.value = t.amp;\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf);\n    clearTimeout(this._waitT);\n    window.removeEventListener('pointermove', this._onPointer);\n    if (this._ro) this._ro.disconnect();\n    if (this._refs) {\n      this._refs.geo.dispose();\n      this._refs.material.dispose();\n      this._refs.renderer.dispose();\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
