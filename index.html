  /* Message discret : apparaît une fois l'intro posée (3,2 s ; 0,8 s pour un visiteur qui revient). */
  .message {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 64px 16px max(28px, calc(env(safe-area-inset-bottom) + 18px));
    background: radial-gradient(ellipse 70% 100% at 50% 100%, rgba(0,0,0,.72), rgba(0,0,0,0) 74%);

    opacity: 0; animation: message 1.4s cubic-bezier(.22,.61,.36,1) 3.2s forwards;
  }

  /* Le lien reste inerte tant qu'il est invisible : un tap pendant l'intro n'ouvre pas la messagerie. */
  .mail { animation: lien 0s linear 3.2s both; }

  /* Portrait : les rubans lumineux remontent jusqu'au message, le voile doit couvrir toute la largeur. */
  @media (max-aspect-ratio: 4/5) {

  .statut::before { background: linear-gradient(90deg, rgba(242,192,138,0), rgba(242,192,138,.8)); }
  .statut::after { background: linear-gradient(90deg, rgba(111,217,204,.8), rgba(111,217,204,0)); }
  .mail {
    pointer-events: auto; display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 14px;

<script>
"use strict";
// Landing « Hexagone » : immersion interactive.
// L'image de la story (espace 1080×1920) reste le seul plan net ; autour, une constellation et des rubans
// procéduraux la prolongent sur toute la largeur. Le pointeur attire la lumière ; un clic rallume le logo.

const W = 1080, H = 1920;
const LOGO = { x: 542, y: 427, r: 215 };
const HEX_OR = { x: 487, y: 392 }, HEX_TE = { x: 600, y: 460 };   // centres des deux hexagones du logo
// Charte : cœur surexposé, lumière, base (or #DC9E61, teal #3DA69D).
const PAL = {
  or: { coeur: "255,244,228", lum: "242,192,138", base: "220,158,97" },
  te: { coeur: "228,255,250", lum: "111,217,204", base: "61,166,157" },
};
const COUL = { orLum: `rgb(${PAL.or.lum})`, teLum: `rgb(${PAL.te.lum})`, orCoeur: `rgb(${PAL.or.coeur})`, teCoeur: `rgb(${PAL.te.coeur})` };
const PARAMS = new URLSearchParams(location.search);
const DEBUG = PARAMS.has("debug");
const TAU = Math.PI * 2;

// ---------- Outils ----------
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = (v) => clamp(v, 0, 1);
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, v) => { const k = clamp01((v - a) / (b - a)); return k * k * (3 - 2 * k); };
const easeOutQuad = (v) => 1 - (1 - v) * (1 - v);
const easeOutQuart = (v) => 1 - (1 - v) ** 4;
const easeInOutCubic = (v) => (v < 0.5 ? 4 * v * v * v : 1 - (-2 * v + 2) ** 3 / 2);
const easeInOutSine = (v) => -(Math.cos(Math.PI * v) - 1) / 2;
const mulberry32 = (a) => () => {
  a |= 0; a = (a + 0x6d2b79f5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const hashU = (n) => {
  n = Math.imul((n | 0) ^ 0x2c1b3c6d, 0x297a2d39);
  n = Math.imul(n ^ (n >>> 15), 0x85ebca6b);
  return ((n ^ (n >>> 13)) >>> 0) / 4294967296;
};
// Deux sinus incommensurables : une respiration qui ne se répète pas de façon visible. Sortie dans [-1, 1].
const bruitLent = (t, p1, p2, ph) => 0.5 * Math.sin((TAU * t) / p1 + ph) + 0.5 * Math.sin((TAU * t) / p2 + ph * 1.7);
// Distance « hexagonale » (hexagone pointe en haut) : vaut R sur le contour d'un hexagone de rayon R.
const hexNorm = (dx, dy) => Math.max(Math.abs(dx), Math.abs(0.5 * dx + 0.866 * dy), Math.abs(0.5 * dx - 0.866 * dy)) / 0.866;
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const ctx2d = (c) => { const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; return g; };
const dernier = (L, t) => { let lo = 0, hi = L.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (L[m] <= t) { r = m; lo = m + 1; } else hi = m - 1; } return r; };

// ---------- Flux : deux splines calées à la main sur les rubans or et teal de l'image (voir ?debug) ----------
const FLUX_OR = [[440, 590], [435, 690], [510, 790], [600, 900], [545, 1005], [425, 1085], [310, 1175], [370, 1285], [470, 1360], [440, 1490], [340, 1640], [255, 1810], [215, 1990]];
const FLUX_TE = [[615, 590], [605, 700], [625, 800], [690, 900], [720, 995], [680, 1085], [590, 1170], [530, 1250], [565, 1330], [650, 1400], [730, 1500], [790, 1650], [835, 1810], [860, 1990]];
const NL = 256;
// Catmull-Rom échantillonnée finement puis reparamétrée par longueur d'arc : vitesse régulière le long du flux.
const construireLut = (pts) => {
  const Q = [pts[0], ...pts, pts[pts.length - 1]], fin = [];
  for (let i = 1; i < Q.length - 2; i++) {
    const p0 = Q[i - 1], p1 = Q[i], p2 = Q[i + 1], p3 = Q[i + 2];
    for (let k = 0; k < 24; k++) {
      const t = k / 24, t2 = t * t, t3 = t2 * t;
      const f = (j) => 0.5 * (2 * p1[j] + (p2[j] - p0[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (3 * p1[j] - p0[j] - 3 * p2[j] + p3[j]) * t3);
      fin.push([f(0), f(1)]);
    }
  }
  fin.push(pts[pts.length - 1]);
  const cum = [0];
  for (let i = 1; i < fin.length; i++) cum.push(cum[i - 1] + Math.hypot(fin[i][0] - fin[i - 1][0], fin[i][1] - fin[i - 1][1]));
  const tot = cum[cum.length - 1], out = new Float32Array(NL * 4);
  let j = 0;
  for (let i = 0; i < NL; i++) {
    const d = (i / (NL - 1)) * tot;
    while (j < fin.length - 2 && cum[j + 1] < d) j++;
    const f = clamp01((d - cum[j]) / (cum[j + 1] - cum[j] || 1));
    const ax = fin[j][0], ay = fin[j][1], tx = fin[j + 1][0] - ax, ty = fin[j + 1][1] - ay, tl = Math.hypot(tx, ty) || 1;
    out[i * 4] = ax + tx * f; out[i * 4 + 1] = ay + ty * f; out[i * 4 + 2] = -ty / tl; out[i * 4 + 3] = tx / tl;
  }
  return out;
};
const LUT_OR = construireLut(FLUX_OR), LUT_TE = construireLut(FLUX_TE);
const P = { x: 0, y: 0, nx: 0, ny: 0 };
const echantillon = (lut, e) => {
  const v = clamp01(e) * (NL - 1), i = Math.min(NL - 2, v | 0), f = v - i, a = i * 4, b = a + 4;
  P.x = lut[a] + (lut[b] - lut[a]) * f; P.y = lut[a + 1] + (lut[b + 1] - lut[a + 1]) * f;
  P.nx = lut[a + 2] + (lut[b + 2] - lut[a + 2]) * f; P.ny = lut[a + 3] + (lut[b + 3] - lut[a + 3]) * f;
};

// Nœuds lumineux réels de l'image (maxima locaux de luminance, hors logo et bokeh), relevés hors ligne :
// base 36, 2 car. x/2, 2 car. y/2, 1 car. couleur (1 = or). Évite getImageData, illisible en file://.
const NOEUDS = ((s) => {
  const o = [];

  if (al.f < 1 && al.t + 0.25 > t0 && al.t > t0 + 3.6) { t0 = al.t + 0.25; a = 0.4; }
  const tau = ts - t0;
  if (tau < 0 || tau > 3.6) return PE;
  PE.amp = a; PE.tau = tau;
  PE.gonfle = tau < 0.6 ? easeInOutSine(tau / 0.6) : 1 - easeInOutSine(clamp01((tau - 0.6) / 1.4));
  return PE;
};

const dessinerConstellation = (ts, install, px, py, m, pr, cx, cy, Rc) => {
  const K = CONST;
  if (!K || !K.n || install <= 0) return;
  const Rc2 = Rc * Rc, lx = cadre.lx;
  for (let i = 0; i < K.n; i++) {
    const f = K.proche[i] ? 0.02 : 0.012;
    let x = K.bx[i] + K.ax[i] * Math.sin(ts * K.wx[i] + K.ph[i]) - px * f * m;
    let y = K.by[i] + K.ay[i] * Math.cos(ts * K.wy[i] + K.ph[i]) - py * f * m;
    let g = 0;
    if (pr > 0.01) { const dx = cx - x, dy = cy - y; g = pr * Math.exp(-(dx * dx + dy * dy) / Rc2); x += dx * 0.12 * g; y += dy * 0.12 * g; }
    if (ONDES.length) g += boostOnde(x, y);
    K.X[i] = x; K.Y[i] = y; K.G[i] = g;
    K.A[i] = K.a[i] * install * (0.75 + 0.25 * Math.sin(ts * K.wb[i] + K.ph[i])) * (1 + 1.8 * Math.min(g, 1));
  }
  // Liens entre voisins d'un même plan ; près du curseur, la portée s'allonge : le réseau se resserre autour.
  let ns = 0;
  const L0 = K.pas * 1.3, L1 = K.pas * 1.55;
  for (let i = 0; i < K.n && ns < SEG_MAX; i++) {
    const xi = K.X[i], yi = K.Y[i], pi = K.proche[i], gi = K.G[i];
    for (let j = i + 1; j < K.n; j++) {
      if (K.proche[j] !== pi) continue;
      const dx = K.X[j] - xi, dy = K.Y[j] - yi, gm = Math.min(1, Math.max(gi, K.G[j]));
      const Lk = (pi ? L1 : L0) * (1 + 0.4 * gm), d2 = dx * dx + dy * dy;
      if (d2 > Lk * Lk) continue;
      const fd = 1 - Math.sqrt(d2) / Lk, a = fd * Math.sqrt(fd) * Math.min(K.A[i], K.A[j]) * 0.55 * (1 + 1.5 * gm);
      if (a < 0.02) continue;
      const o = ns * 5;
      SEG[o] = xi; SEG[o + 1] = yi; SEG[o + 2] = K.X[j]; SEG[o + 3] = K.Y[j];
      SEG[o + 4] = ((xi + K.X[j]) * 0.5 < lx ? 0 : NB) + Math.min(NB - 1, (a * 10) | 0);
      if (++ns >= SEG_MAX) break;
    }
  }
  // Un tracé par couleur et niveau d'opacité : 16 strokes au lieu d'un par lien.
  ctx.globalCompositeOperation = "lighter"; ctx.lineWidth = 0.75;
  for (let b = 0; b < 2 * NB; b++) {
    let n = 0;
    ctx.beginPath();
    for (let s = 0; s < ns; s++) {
      const o = s * 5;
      if (SEG[o + 4] !== b) continue;
      ctx.moveTo(SEG[o], SEG[o + 1]); ctx.lineTo(SEG[o + 2], SEG[o + 3]); n++;
    }
    if (!n) continue;
    ctx.strokeStyle = b < NB ? COUL.orLum : COUL.teLum; ctx.globalAlpha = ((b % NB) + 0.5) / 10; ctx.stroke();
  }
  for (let i = 0; i < K.n; i++) blit(K.X[i] < lx ? SP.or : SP.te, K.X[i], K.Y[i], K.t[i] * (1 + 0.6 * Math.min(K.G[i], 1)) * 4, K.A[i]);
  ctx.globalCompositeOperation = "screen";
  for (let i = 0; i < K.n; i++) {
    const g = Math.min(K.G[i], 1);
    if (g > 0.12) blit(K.X[i] < lx ? SP.haloOr : SP.haloTe, K.X[i], K.Y[i], 10 + 22 * g, 0.22 * g * install);
  }
};

const dessinerRubans = (ts, install, px, py, m) => {
  if (!RUBANS.length || install <= 0) return;
  ctx.save();
  ctx.translate(-px * 0.022 * m, -py * 0.022 * m);
  ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const r of RUBANS) {
    ctx.beginPath();
    for (let k = 0; k <= 28; k++) {
      const q = k / 28;
      const x = r.x0 + r.cote * q * r.long;
      const y = r.y0 + r.ouv * q + r.amp * Math.sin(Math.PI * q * r.f + r.ph + ts * r.w) * smooth(0, 0.35, q);
      if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.setLineDash(r.dash); ctx.lineDashOffset = -((ts * r.v) % r.per);   // les points filent vers l'extérieur
    ctx.lineWidth = r.lw; ctx.strokeStyle = r.grad; ctx.globalAlpha = r.a * install;
    ctx.stroke();
  }
  ctx.setLineDash(VIDE);
  ctx.restore();
};

// Reflet : la bande lumineuse est multipliée par le recadrage du logo, donc seul le métal clair brille.
const dessinerReflet = (ts, S, pX, pY) => {
  if (!logoCrop) return;
  const tt = ts % HORIZON, i = dernier(REFLETS, tt);
  if (i < 0) return;
  const q = (tt - REFLETS[i]) / 1.1;
  if (q >= 1) return;
  const e = easeInOutSine(q), I = 0.55 + 0.3 * hashU(i * 31 + 7);
  const g = refletCv.getContext("2d"), w = refletCv.width, h = refletCv.height;
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1; g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
  const bx = lerp(-0.45, 1.45, e) * w, by = h / 2, dx = 0.906 * 0.16 * w, dy = 0.423 * 0.16 * w;   // 115°, comme la story
  const gr = g.createLinearGradient(bx - dx, by - dy, bx + dx, by + dy);
  gr.addColorStop(0, "rgba(255,250,240,0)"); gr.addColorStop(0.5, `rgba(255,250,240,${I.toFixed(3)})`); gr.addColorStop(1, "rgba(255,250,240,0)");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = "multiply"; g.drawImage(logoCrop, 0, 0);
  const lr = LOGO.r * 1.25;
  ctx.globalCompositeOperation = "screen"; ctx.globalAlpha = 1;
  ctx.drawImage(refletCv, (LOGO.x - lr) * S + pX, (LOGO.y - lr) * S + pY, 2 * lr * S, 2 * lr * S);
};

const dessinerOndes = () => {
  if (!ONDES.length) return;
  ctx.globalCompositeOperation = "lighter"; ctx.lineJoin = "miter";
  for (const o of ONDES) {
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const an = (Math.PI / 3) * k - Math.PI / 2 + o.rot;
      if (k) ctx.lineTo(o.x + o.R * Math.cos(an), o.y + o.R * Math.sin(an)); else ctx.moveTo(o.x + o.R * Math.cos(an), o.y + o.R * Math.sin(an));
    }
    ctx.closePath();
    ctx.lineWidth = o.lw; ctx.strokeStyle = o.or ? COUL.orLum : COUL.teLum; ctx.globalAlpha = o.a; ctx.stroke();
  }
};

const dessinerParticules = (ts, S, qX, qY, yf, pe, pr, cx, cy, Rc) => {
  const Rc2 = Rc * Rc, fini = Number.isFinite(yf);
  // Pulsation : une bande gaussienne descend les flux ; le teal suit l'or avec 150 ms de retard.
  let uOr = -9, uTe = -9;
  if (pe.amp > 0) {
    const bo = pe.tau - 0.45, bt = bo - 0.15;
    if (bo > 0 && bo < 2.8) uOr = -0.1 + 1.2 * easeInOutCubic(bo / 2.8);
    if (bt > 0 && bt < 2.8) uTe = -0.1 + 1.2 * easeInOutCubic(bt / 2.8);
  }
  for (let i = 0; i < PARTICULES.length; i++) {
    if (eco && i % 5 > 2) continue;
    const p = PARTICULES[i], lut = p.or ? LUT_OR : LUT_TE;
    const u = (p.dec + ts * p.v) % 1, e = u ** 1.35;   // accélèrent en descendant : vitesse et taille vont ensemble
    echantillon(lut, e);
    const ond = p.bruit + 6 * Math.sin(ts * 0.7 + p.ph);   // décalage perpendiculaire au flux, qui ondule
    const xs = P.x + P.nx * ond, ys = P.y + P.ny * ond;
    let a = Math.sin(u * Math.PI) ** 0.8 * p.a;
    if (fini) { if (ys > yf) continue; a *= smooth(0, 120, yf - ys); }
    const up = p.or ? uOr : uTe;
    const gain = up > -9 ? 1 + 1.2 * pe.amp * Math.exp(-(((e - up) / 0.06) ** 2)) : 1;
    let X = xs * S + qX, Y = ys * S + qY, ax = 0, ay = 0;
    if (pr > 0.01) {
      const dx = cx - X, dy = cy - Y, g = pr * Math.exp(-(dx * dx + dy * dy) / Rc2);
      ax = dx * 0.16 * g; ay = dy * 0.16 * g; X += ax; Y += ay; a *= 1 + 0.8 * g;
    }
    const r = p.taille * (0.6 + 1.6 * e) * S * (1 + 0.3 * (gain - 1)), s = p.or ? SP.or : SP.te;
    blit(s, X, Y, r, a * gain);
    if (p.data) {
      for (let k = 1; k <= 2; k++) {   // traînée : deux échos en arrière sur la trajectoire
        echantillon(lut, e - 0.012 * k);
        blit(s, (P.x + P.nx * ond) * S + qX + ax, (P.y + P.ny * ond) * S + qY + ay, r * (1 - 0.28 * k), (a * gain * 0.5) / k);
      }
    }
  }
};

// Étincelles posées sur les vrais nœuds de l'image : c'est l'image qui s'allume, pas des paillettes en plus.
const dessinerEtincelles = (ts, S, pX, pY, install) => {
  if (install <= 0) return;
  const n = eco ? 18 : ETINCELLES.length;
  for (let i = 0; i < n; i++) {
    const sp = ETINCELLES[i], tt = ts + sp.ph, cyc = Math.floor(tt / sp.P), tau = tt - cyc * sp.P;
    const env = tau < 0.12 ? easeOutQuad(tau / 0.12) : Math.exp(-(tau - 0.12) / sp.D);   // attaque brève, extinction lente
    if (env < 0.02) continue;
    const nd = NOEUDS[Math.floor(hashU(i * 9973 + cyc * 7919) * NOEUDS.length)], vis = visPlaque(nd.x, nd.y);
    if (vis < 0.05) continue;
    const X = nd.x * S + pX, Y = nd.y * S + pY, r = sp.taille * S * (0.7 + 0.3 * env), a = 0.8 * env * install * vis;
    blit(nd.or ? SP.or : SP.te, X, Y, r, a);
    if (sp.glint && env > 0.08) {
      ctx.globalAlpha = 0.5 * a; ctx.lineWidth = 1.2; ctx.strokeStyle = nd.or ? COUL.orCoeur : COUL.teCoeur;
      ctx.beginPath(); ctx.moveTo(X - 2 * r, Y); ctx.lineTo(X + 2 * r, Y); ctx.moveTo(X, Y - 2 * r); ctx.lineTo(X, Y + 2 * r); ctx.stroke();
    }
  }
};

const dessinerNoeudsEclaires = (S, pX, pY, pr, cx, cy, Rc) => {
  if (pr < 0.01 && !ONDES.length) return;
  const Rc2 = Rc * Rc, sz = clamp(S / 0.7, 0.6, 1.4);
  for (const nd of NOEUDS) {
    const X = nd.x * S + pX, Y = nd.y * S + pY;
    let g = 0;
    if (pr > 0.01) { const dx = cx - X, dy = cy - Y; g = pr * Math.exp(-(dx * dx + dy * dy) / Rc2); }
    if (ONDES.length) g += boostOnde(X, Y);
    if (g < 0.03) continue;
    blit(nd.or ? SP.or : SP.te, X, Y, (5 + 9 * Math.min(g, 1.2)) * sz, Math.min(1, 0.9 * g) * visPlaque(nd.x, nd.y));
  }
};

const dessinerBokeh = (ts, install, px, py, m) => {
  const dx = -px * 0.04 * m, dy = -py * 0.04 * m;
  for (const b of BOKEH) {
    const x = b.x + dx + 0.015 * m * Math.sin((TAU * ts) / b.P + b.ph), y = b.y + dy + 0.012 * m * Math.cos((TAU * ts) / (b.P * 1.3) + b.ph);
    blit(b.or ? SP.hexOr : SP.hexTe, x, y, b.r, b.a * (0.75 + 0.25 * Math.sin((TAU * ts) / (b.P * 0.37) + b.ph)) * install);
  }
};

// Ouverture : étincelle d'anticipation, l'image se révèle en iris depuis le logo, puis la lumière coule vers le bas.
const dessinerOuverture = (ts, S, pX, pY, yf) => {
  const lx = LOGO.x * S + pX, ly = LOGO.y * S + pY, plume = 180 * S;
  const Rmax = Math.hypot(Math.max(lx, vw - lx), Math.max(ly, vh - ly)) + plume;
  const ri = Rmax * easeOutQuart(clamp01((ts - 0.45) / 1.5));
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  if (ri < Rmax) {
    const g = ctx.createRadialGradient(lx, ly, Math.max(0, ri - plume), lx, ly, Math.max(1, ri));
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "#000");
    ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
  }
  if (Number.isFinite(yf)) {
    const y = yf * S + pY;
    if (y < vh) {
      const g = ctx.createLinearGradient(0, y, 0, y + 260 * S);
      g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "#000");
      ctx.fillStyle = g; ctx.fillRect(0, y, vw, vh - y + 2);
    }
  }
  const te = ts - 0.1;
  if (te > 0 && ts < 1.6) {
    const a = easeOutQuad(clamp01(te / 0.4)) * (1 - smooth(0.9, 1.6, ts));
    const r = lerp(6, 14, easeOutQuad(clamp01(te / 0.5))) * clamp(S * 1.6, 0.8, 1.6);
    ctx.globalCompositeOperation = "lighter";
    blit(SP.blanc, lx, ly, r * 3, 0.9 * a);
    blit(SP.haloOr, lx - r, ly, r * 7, 0.25 * a);
    blit(SP.haloTe, lx + r, ly, r * 7, 0.25 * a);
  }
};

const dessinerDebug = (S, pX, pY) => {
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.lineWidth = 1.5;
  for (const [pts, lut, col] of [[FLUX_OR, LUT_OR, "#f0f"], [FLUX_TE, LUT_TE, "#0f0"]]) {
    ctx.strokeStyle = col; ctx.beginPath();
    for (let i = 0; i < NL; i++) { const x = lut[i * 4] * S + pX, y = lut[i * 4 + 1] * S + pY; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
    ctx.stroke();
    for (const [x, y] of pts) { ctx.beginPath(); ctx.arc(x * S + pX, y * S + pY, 4, 0, TAU); ctx.stroke(); }
  }
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 1;
  for (const nd of NOEUDS) ctx.strokeRect(nd.x * S + pX - 2, nd.y * S + pY - 2, 4, 4);
  // En mode couverture, l'image ne doit jamais laisser voir un bord (gauche, droite, bas).
  if (cadre.k === 0 && (pX > 0.5 || pX + W * S < vw - 0.5 || pY + H * S < vh - 0.5)) console.warn("plaque : bord visible", { pX, pY, S });
};

// ---------- Composition d'une image au temps de scène ts ----------
const dessiner = (ts, noir) => {
  const c = cadre;
  if (!c) return;
  const m = Math.min(vw, vh);
  // Caméra : léger travelling avant qui se pose (0,97 → 1), puis respiration lente qui ne descend jamais sous 1.
  const zoom = lerp(0.97, 1, easeOutQuart(clamp01(ts / 4.5))) + 0.006 * (0.5 + 0.5 * bruitLent(ts, 13.7, 21.3, 0.4));
  const S = c.s * zoom, OX = c.lx - LOGO.x * S, OY = c.ly - LOGO.y * S;
  // Parallaxe : ressort du pointeur + dérive autonome lente (plus ample au tactile, où rien d'autre ne bouge).
  const am = grossier ? 0.3 : 0.12, pa = grossier ? 23 : 31, pb = grossier ? 31 : 47;
  const px = par.x + am * Math.sin((TAU * ts) / pa), py = par.y + am * Math.sin((TAU * ts) / pb + 1.1);
  const pX = OX - px * 0.010 * m, pY = OY - py * 0.010 * m;   // plan de l'image
  const qX = OX - px * 0.022 * m, qY = OY - py * 0.022 * m;   // plan des particules, plus proche
  const install = easeInOutSine(clamp01((ts - 2.4) / 1.6));
  const yf = ts >= 3.4 ? Infinity : LOGO.y + 170 + (H + 80 - LOGO.y - 170) * easeInOutCubic(clamp01((ts - 1.1) / 2.3));
  const pr = reduit ? 0 : ptr.presence, cx = ptr.x, cy = ptr.y, Rc = clamp(0.17 * m, 110, 240);
  calculerOndes(ts, S, pX, pY);

  ctx.setTransform(dprX, 0, 0, dprY, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  if (amb) ctx.drawImage(amb.cv, -amb.mx - px * 0.004 * m, -amb.my - py * 0.004 * m, amb.w, amb.h);
  else { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, vw, vh); }

  // Derrière l'image : son fondu les recouvre progressivement, elle reste l'unique plan net.
  dessinerConstellation(ts, install, px, py, m, pr, cx, cy, Rc);
  dessinerRubans(ts, install, px, py, m);

  if (plaque) {
    const nette = smooth(0.7, 1.35, ts);   // mise au point d'ouverture : du flou au net
    ctx.globalCompositeOperation = "source-over";
    ctx.imageSmoothingQuality = W * S * dprX > plaque.width * 1.05 ? "high" : "low";
    if (nette < 1 && floue) { ctx.globalAlpha = 1; ctx.drawImage(floue, pX, pY, W * S, H * S); }
    if (nette > 0.004) { ctx.globalAlpha = nette; ctx.drawImage(plaque, pX, pY, W * S, H * S); }
  }

  const pe = etatPulse(ts);
  const souffle = (0.85 + 0.15 * bruitLent(ts, 7.3, 11.9, 0.3)) * (1 + 0.25 * pe.amp * pe.gonfle) * clamp01((ts - 1.1) / 0.9);
  ctx.globalCompositeOperation = "screen";
  blit(SP.haloOr, HEX_OR.x * S + pX, HEX_OR.y * S + pY, LOGO.r * 1.8 * S, 0.16 * souffle);
  blit(SP.haloTe, HEX_TE.x * S + pX, HEX_TE.y * S + pY, LOGO.r * 1.8 * S, 0.15 * souffle);
  for (const al of ALLUMAGES) {   // bloom bicolore serré : attaque 90 ms, extinction exponentielle
    const tau = ts - al.t;
    if (tau < 0 || tau > 2.5) continue;
    const env = (tau < 0.09 ? easeOutQuad(tau / 0.09) : Math.exp(-(tau - 0.09) / 0.45)) * al.f;
    blit(SP.haloOr, HEX_OR.x * S + pX, HEX_OR.y * S + pY, LOGO.r * 1.6 * S, 0.3 * env);
    blit(SP.haloTe, HEX_TE.x * S + pX, HEX_TE.y * S + pY, LOGO.r * 1.6 * S, 0.28 * env);
  }
  dessinerReflet(ts, S, pX, pY);

  ctx.globalCompositeOperation = "lighter";
  dessinerParticules(ts, S, qX, qY, yf, pe, pr, cx, cy, Rc);
  dessinerEtincelles(ts, S, pX, pY, install);
  dessinerNoeudsEclaires(S, pX, pY, pr, cx, cy, Rc);

  ctx.globalCompositeOperation = "screen";
  dessinerBokeh(ts, install, px, py, m);
  if (pr > 0.01) blit(cx < c.lx ? SP.haloOr : SP.haloTe, cx, cy, 0.22 * m, 0.05 * pr * install);

  if (ts < 3.4) dessinerOuverture(ts, S, pX, pY, yf);
  dessinerOndes();   // au-dessus de l'ouverture : l'onde traverse encore le noir
  if (noir > 0) { ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = noir; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, vw, vh); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  if (DEBUG) dessinerDebug(S, pX, pY);
};

// ---------- Entrées : pointeur, toucher, gyroscope ----------
const allumer = () => {
  if (!lance || reduit) return;
  const ts = horloge + DECAL, last = ALLUMAGES[ALLUMAGES.length - 1];
  if (ts < 3 || ts - last.t < 3) return;   // pas pendant l'ouverture, et 3 s minimum entre deux
  ALLUMAGES.push({ t: ts, f: 0.85 });
  if (ALLUMAGES.length > 4) ALLUMAGES.shift();
};
addEventListener("pointermove", (e) => {
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.dernier = performance.now();
  if (e.pointerType === "touch") {
    if (ptr.touche) { const d = Math.min(vw, vh) * 0.5; ptr.ix = clamp((ptr.x - ptr.x0) / d, -1, 1); ptr.iy = clamp((ptr.y - ptr.y0) / d, -1, 1); }
  } else {
    ptr.dedans = true; ptr.nx = clamp((ptr.x / vw) * 2 - 1, -1, 1); ptr.ny = clamp((ptr.y / vh) * 2 - 1, -1, 1);
  }
}, { passive: true });
addEventListener("pointerdown", (e) => {
  ptr.x = ptr.x0 = e.clientX; ptr.y = ptr.y0 = e.clientY; ptr.t0 = ptr.dernier = performance.now();
  if (e.pointerType === "touch") { ptr.touche = true; ptr.ix = ptr.iy = 0; }
}, { passive: true });
const finPointeur = (e) => {
  if (e.type === "pointerup" && e.button <= 0 && !(e.target.closest && e.target.closest("a")) && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) < 12 && performance.now() - ptr.t0 < 500) allumer();
  if (e.pointerType === "touch") { ptr.touche = false; ptr.ix = ptr.iy = 0; }
};
addEventListener("pointerup", finPointeur, { passive: true });
addEventListener("pointercancel", finPointeur, { passive: true });
addEventListener("mouseout", (e) => { if (!e.relatedTarget) ptr.dedans = false; });
addEventListener("blur", () => { ptr.dedans = false; ptr.touche = false; ptr.ix = ptr.iy = 0; });
// Android seulement : iOS exige une demande de permission, dont la fenêtre système afficherait du texte.
addEventListener("deviceorientation", (e) => {
  if (e.gamma == null || e.beta == null) return;
  if (!gyro.ok) { gyro.bg = e.gamma; gyro.bb = e.beta; gyro.ok = true; }
  gyro.g = e.gamma; gyro.b = e.beta;
});

const maj = (dt, now) => {
  let tx = 0, ty = 0;
  if (gyro.ok) {   // la position de repos suit l'inclinaison tenue (passe-bas de 3 s)
    const k = 1 - Math.exp(-dt / 3);
    gyro.bg += (gyro.g - gyro.bg) * k; gyro.bb += (gyro.b - gyro.bb) * k;
  }
  if (ptr.touche) { tx = ptr.ix; ty = ptr.iy; }
  else if (ptr.dedans && now - ptr.dernier < 4000) { tx = ptr.nx; ty = ptr.ny; }
  else if (gyro.ok) { tx = 0.6 * clamp((gyro.g - gyro.bg) / 20, -1, 1); ty = 0.6 * clamp((gyro.b - gyro.bb) / 20, -1, 1); }
  // Ressort presque critique (ζ 0,85, ω 4,5), intégré sur le temps réel : même rendu à 60 et 120 Hz.
  const w = 4.5, z = 0.85;
  par.vx += (w * w * (tx - par.x) - 2 * z * w * par.vx) * dt; par.x += par.vx * dt;
  par.vy += (w * w * (ty - par.y) - 2 * z * w * par.vy) * dt; par.y += par.vy * dt;
  const cible = ptr.touche || (ptr.dedans && now - ptr.dernier < 2500) ? 1 : 0;
  ptr.presence += (cible - ptr.presence) * (1 - Math.exp(-dt / (cible ? 0.25 : 0.9)));
};

// ---------- Boucle et cycle de vie ----------
let horloge = 0, prec = null, raf = 0, lance = false, introVue = false, perfN = 0, perfS = 0;
const surveiller = (dt) => {
  // Qualité adaptative, une seule fois et sans retour : DPR 1 et populations réduites si l'appareil ne suit pas.
  if (eco || horloge < 4 || dt <= 0) return;
  perfS += dt;
  if (++perfN >= 120) { if (perfS / perfN > 0.022) { eco = true; sale = true; } perfN = 0; perfS = 0; }
};
const boucle = (now) => {
  raf = requestAnimationFrame(boucle);
  // ~60-72 i/s sur écrans 120/144 Hz ; seuil entre 8,3 ms (120 Hz) et 10 ms : à 10 pile, un écran 100 Hz
  // (courant en 21:9) sauterait une image sur deux au hasard de la gigue, d'où des saccades.
  if (prec !== null && now - prec < 9) return;
  const dt = prec === null ? 0 : Math.min((now - prec) / 1000, 1 / 30);   // horloge accumulée : aucun saut au retour
  prec = now; horloge += dt;
  if (sale) reconstruire();
  maj(dt, now);
  dessiner(horloge + DECAL, RAPIDE ? 1 - easeInOutSine(clamp01(horloge / 1.2)) : 0);
  surveiller(dt);
  if (!introVue && horloge > 4) { introVue = true; try { sessionStorage.setItem("khepria-intro", "1"); } catch (e) { /* sans effet */ } }
};
const T_FIXE = 7;   // image figée composée (mouvement réduit) : ouverture finie, aucun accent en cours
const dessinerFixe = () => { if (sale) reconstruire(); dessiner(T_FIXE, 0); };
const relancer = () => { if (!raf && !document.hidden) { prec = null; raf = requestAnimationFrame(boucle); } };
const arreter = () => { cancelAnimationFrame(raf); raf = 0; };

const planifier = () => { sale = true; if (lance && reduit) requestAnimationFrame(dessinerFixe); };
addEventListener("resize", planifier);
const surveillerDpr = () => {   // fenêtre déplacée vers un écran d'une autre densité : pas toujours d'événement resize
  const mq = matchMedia(`(resolution: ${devicePixelRatio || 1}dppx)`), f = () => { planifier(); surveillerDpr(); };
  if (mq.addEventListener) mq.addEventListener("change", f, { once: true }); else if (mq.addListener) mq.addListener(f);
};
surveillerDpr();
document.addEventListener("visibilitychange", () => {
  if (!lance || reduit) return;
  if (document.hidden) arreter(); else relancer();
});
const changerReduit = (e) => {
  reduit = e.matches;
  if (!lance) return;
  arreter();
  if (reduit) requestAnimationFrame(dessinerFixe); else relancer();
};
if (mqReduit.addEventListener) mqReduit.addEventListener("change", changerReduit); else if (mqReduit.addListener) mqReduit.addListener(changerReduit);

const demarrer = () => {
  lance = true;
  reconstruire();
  if (reduit) dessinerFixe(); else relancer();
};
// On attend le décodage complet de l'image avant la première image : l'ouverture ne saccade pas.
// En cas d'échec (404, blocage), la scène procédurale tourne quand même sur le noir.
const img = new Image();
img.decoding = "async";
img.src = "/fond.webp";   // chemin absolu : la landing répond aussi sur des URL profondes (/a/b/)
// Filet : certains moteurs ne résolvent jamais decode() (onglet en arrière-plan, headless) ; on part 400 ms après load.
const pret = new Promise((ok) => {
  img.decode().then(() => ok(true), () => { if (img.complete) ok(img.naturalWidth > 0); });
  img.addEventListener("load", () => setTimeout(() => ok(true), 400));
  img.addEventListener("error", () => ok(false));
}).then((charge) => { src = charge ? img : null; }).then(demarrer);

// Crochet de test : compose la scène exactement comme au temps t (s), de façon synchrone, sans requestAnimationFrame.
window.__rendre = (t) => {
  t = Math.max(0, Number(t) || 0);
  if (sale) reconstruire();
  dessiner(t + DECAL, RAPIDE ? 1 - easeInOutSine(clamp01(t / 1.2)) : 0);
};
window.__pret = pret;   // résolue quand l'image est décodée (ou a échoué)
</script>
