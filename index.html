*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#07090a;color:#f3f1ec;font-family:Manrope,system-ui,sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.page{position:relative;min-height:100dvh;display:grid;grid-template-rows:1fr auto;pointer-events:none}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,16px);padding:24px 24px 4px;text-align:center}
.symbol{height:clamp(96px,23dvh,230px);width:auto;display:block;overflow:visible;filter:drop-shadow(0 0 34px rgba(7,9,10,.95))}
.words{width:min(300px,68vw);height:auto;display:block}
#core{position:static;display:block;width:clamp(170px,31dvh,320px);height:clamp(170px,31dvh,320px);animation:appear 1s 2.8s both}
h1{margin:0;font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:600;letter-spacing:-.02em;line-height:1.1;animation:rise .8s 3.3s both cubic-bezier(.2,.7,.2,1)}
.bar{position:relative;width:min(260px,62vw);height:3px;margin-top:6px;overflow:hidden;background:#24312f;border-radius:2px;animation:appear .6s 3.6s both}
.bar::after{content:"";position:absolute;inset:0 auto 0 0;width:38%;border-radius:2px;background:linear-gradient(90deg,#dc9e61,#3da69d);animation:load 2.2s 3.6s infinite cubic-bezier(.65,0,.35,1) both}
@keyframes load{from{transform:translateX(-105%)}to{transform:translateX(270%)}}
footer{display:flex;justify-content:center;gap:28px;padding:14px 24px 20px;font-size:.875rem;animation:appear .8s 3.7s both}
a{pointer-events:auto;color:#c9cfcb;text-decoration:none;padding:6px 2px;border-bottom:1px solid #5b6b67;transition:color .15s,border-color .15s}
a:hover{color:#f3f1ec;border-color:#dc9e61}
a:focus-visible{outline:2px solid #6fd9cc;outline-offset:3px}
.trace{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s .2s forwards cubic-bezier(.65,0,.3,1)}
.run{stroke-linecap:round;stroke-opacity:.9;stroke-dasharray:.018 1.1;stroke-dashoffset:.03;animation:travel 6s 3.6s infinite cubic-bezier(.6,0,.4,1)}
.shape{stroke:currentColor;stroke-width:5;stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;animation:draw 1.3s 1s forwards ease-in-out,fill .7s 2.1s forwards}
.shape[fill="#DC9E61"]{color:#dc9e61}.shape[fill="#3DA69D"]{color:#3da69d}
.glyph{opacity:0;animation:appear .35s calc(2.5s + var(--i)*28ms) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill-opacity:1}}
@keyframes travel{0%{stroke-dashoffset:.03}55%,100%{stroke-dashoffset:-1.03}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  h1,footer,#core,.bar,.trace,.shape,.glyph{animation:none;opacity:1;stroke-dashoffset:0;fill-opacity:1}
  .run{display:none}
  .bar::after{animation:none;width:100%;opacity:.7}
}
</style>

<script>
(function(){
  var c=document.getElementById('lattice'),x=c.getContext('2d'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var R=38,cells=[],W,H,raf=0,wave=still?null:performance.now()+1500,last=0;
  function build(){
    var d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    var w=Math.sqrt(3)*R,h=1.5*R;cells=[];
    for(var r=-1;r*h<H+R;r++)for(var q=-1;q*w<W+w;q++){
      var px=q*w+(r%2?w/2:0),py=r*h;cells.push({x:px,y:py,e:0,d:Math.hypot(px-W/2,py-H*.42)});
    }
    paint();
  }
  function hex(a,b,s){x.beginPath();for(var i=0;i<6;i++){var t=Math.PI/3*i-Math.PI/2,u=a+s*Math.cos(t),v=b+s*Math.sin(t);i?x.lineTo(u,v):x.moveTo(u,v)}x.closePath()}
  function paint(){
    x.clearRect(0,0,W,H);x.lineWidth=1;
    for(var i=0;i<cells.length;i++){var k=cells[i],rgb=k.x<W/2?'220,158,97':'61,166,157';
      hex(k.x,k.y,R-1);x.strokeStyle='rgba(36,49,47,.42)';x.stroke();
      if(k.e>.01){x.strokeStyle='rgba('+rgb+','+k.e*.8+')';x.stroke();x.fillStyle='rgba('+rgb+','+k.e*.07+')';x.fill()}
    }
  }
  function tick(t){
    var dt=Math.min((t-last)/16.7,3),on=false;last=t;
    if(wave!==null){var f=(t-wave)*.62;if(f>Math.hypot(W,H)+200)wave=null;else on=true;
      if(f>0)cells.forEach(function(k){if(Math.abs(k.d-f)<R)k.e=Math.max(k.e,.62)})}
    cells.forEach(function(k){k.e*=Math.pow(.955,dt);if(k.e>.01)on=true;else k.e=0});
    paint();raf=on?requestAnimationFrame(tick):0;
  }
  function go(){if(!raf&&!still){last=performance.now();raf=requestAnimationFrame(tick)}}
  addEventListener('resize',build);
  if(!still)addEventListener('pointermove',function(e){cells.forEach(function(k){var d=Math.hypot(k.x-e.clientX,k.y-e.clientY);if(d<R*2.4)k.e=Math.max(k.e,.75*(1-d/(R*2.4)))});go()},{passive:true});
  build();go();
})();
(function(){
  var c=document.getElementById('core'),g=c.getContext('2d'),still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S,tx=0,ty=0,vx=0,vy=0,TAU=Math.PI*2,dots=[];
  var rings=[
    {r:.98,n:180,dash:15,ax:.95,ay:0,pr:0,sp:.6,w:1.2,ticks:1},
    {r:.9,n:144,ax:.95,ay:0,pr:0,sp:0,w:.7},
    {r:.78,n:144,dash:24,ax:.5,ay:.8,pr:.95,sp:-1.5,w:1.5},
    {r:.66,n:120,dash:10,ax:-.62,ay:.5,pr:-1.25,sp:2,w:1.1},
    {r:.5,n:6,ax:.95,ay:0,pr:.6,sp:-1.2,w:1.6}
  ];
  var T=0;
  for(var i=0,N=150;i<N;i++){var y=1-2*(i+.5)/N,q=Math.sqrt(1-y*y),a=i*2.39996;dots.push([q*Math.cos(a)*.34,y*.34,q*Math.sin(a)*.34])}
  function size(){var d=Math.min(devicePixelRatio||1,2);S=c.clientWidth;c.width=S*d;c.height=S*d;g.setTransform(d,0,0,d,0,0)}
  function rot(p,ax,ay,az){
    var x=p[0],y=p[1],z=p[2],s,k,t;
    s=Math.sin(az);k=Math.cos(az);t=x*k-y*s;y=x*s+y*k;x=t;
    s=Math.sin(ax);k=Math.cos(ax);t=y*k-z*s;z=y*s+z*k;y=t;
    s=Math.sin(ay);k=Math.cos(ay);t=x*k+z*s;z=-x*s+z*k;x=t;
    return [x,y,z];
  }
  function view(p){var q=rot(p,vy-.18+.45*Math.sin(T*.8),vx+T*.9,.35*Math.sin(T*.55)),f=3.2/(3.2+q[2]),R=S*.46;return {x:S/2+q[0]*f*R,y:S/2+q[1]*f*R,z:q[2]}}
  function tint(x,z,o){var a=Math.max(.05,(.62-z*.5)*o);return 'rgba('+(x<S/2?'220,158,97':'61,166,157')+','+a+')'}
  function seg(a,b,w){g.strokeStyle=tint((a.x+b.x)/2,(a.z+b.z)/2,1);g.lineWidth=w*(1.15-(a.z+b.z)*.22);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  function ringPoint(k,r,j){
    var t=j/k.steps*TAU;
    if(k.n===6){var e=((t%(TAU/6))+TAU/6)%(TAU/6)-TAU/12;r=r*Math.cos(TAU/12)/Math.cos(e)}
    return [r*Math.cos(t-TAU/4),r*Math.sin(t-TAU/4),0];
  }
  function draw(ms){
    var t=ms/1000,j,p;T=t;
    g.clearRect(0,0,S,S);g.globalCompositeOperation='lighter';g.lineCap='round';
    vx+=(tx-vx)*.05;vy+=(ty-vy)*.05;
    var pulse=.72+.28*Math.sin(t*1.7),glow=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S*.2);
    glow.addColorStop(0,'rgba(243,241,236,'+.34*pulse+')');glow.addColorStop(.3,'rgba(111,217,204,'+.16*pulse+')');glow.addColorStop(1,'rgba(61,166,157,0)');
    g.fillStyle=glow;g.fillRect(0,0,S,S);
    rings.forEach(function(k){
      k.steps=k.n===6?72:k.n;
      var az=t*k.sp,ay=k.ay+t*k.pr,prev=null;
      for(j=0;j<=k.steps;j++){
        p=view(rot(ringPoint(k,k.r,j),k.ax,ay,az));
        if(prev&&(!k.dash||j%k.dash<k.dash*.68))seg(prev,p,k.w);
        if(k.ticks&&j%5===0&&j<k.steps)seg(p,view(rot(ringPoint(k,k.r-(j%15?.025:.06),j),k.ax,ay,az)),.8);
        prev=p;
      }
    });
    dots.forEach(function(d){
      p=view(rot(d,.4,t*.55,t*.2));
      g.fillStyle=tint(p.x,p.z,1.15);
      var s=Math.max(.7,1.9-p.z*2.2);g.fillRect(p.x-s/2,p.y-s/2,s,s);
    });
    g.globalCompositeOperation='source-over';
    if(!still)requestAnimationFrame(draw);
  }
  addEventListener('resize',function(){size();if(still)draw(0)});
  if(!still)addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*.7;ty=-(e.clientY/innerHeight-.5)*.5},{passive:true});
  size();still?draw(1200):requestAnimationFrame(draw);
})();
</script>
