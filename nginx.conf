server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Pas de journal des visites : les mentions légales affirment que le serveur n'enregistre pas les visites.
    access_log off;

    # En-têtes de sécurité, hérités par tous les blocs ci-dessous.
    # Ne JAMAIS ajouter d'add_header dans un location : nginx abandonnerait alors ceux-ci (cache = directive expires).
    # shortcut: 'unsafe-inline' car CSS et JS sont inline dans la page ; passer à des empreintes si un script tiers arrive un jour.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    error_page 404 /404.html;

    # Health checks (Coolify / Traefik) — réponses légères, sans servir le HTML.
    # default_type, pas add_header : sinon deux en-têtes Content-Type (octet-stream + text/plain).
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pas de favicon dédié (icône inline dans les pages).
    location = /favicon.ico {
        log_not_found off;
        return 204;
    }

    # Cache court sur les pages (elles peuvent encore bouger avant le lancement).
    location = / {
        expires 5m;
        try_files /index.html =404;
    }
    location = /mentions-legales {
        expires 5m;
        try_files /mentions-legales.html =404;
    }

    # Tout le reste : le fichier s'il existe, sinon un vrai 404 (plus de repli sur la landing).
    location / {
        expires 5m;
        try_files $uri =404;
    }

    # Images : cache d'une semaine.
    location ~* \.(webp|jpg)$ {
        expires 7d;
        try_files $uri =404;
    }
}
