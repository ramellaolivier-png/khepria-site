server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Health checks (Coolify / Traefik) — réponses légères, sans servir le HTML.
    # default_type, pas add_header : sinon deux en-têtes Content-Type (octet-stream + text/plain).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /api/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pas de favicon dédié (page autonome) — éviter de servir tout le HTML.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Page unique : tout chemin retombe sur la landing.
    location / {
        try_files $uri /index.html;
    }

    # Images : un fichier absent renvoie 404 (pas la landing) ; cache d'une semaine.
    location ~* \.(webp|jpg)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Cache court (la page peut encore bouger avant le lancement).
    location = /index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }
}
